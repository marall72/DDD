version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: DDD 
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "14330:1433"
    networks:
      - mc2_network
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

networks:
  mc2_network:
    driver: bridge

volumes:
  sql_data:
